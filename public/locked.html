<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <title>Claude Code Hub</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --border: #0f3460;
      --accent: #e86f33;
      --surface: #16213e;
      --surface-hover: #1f2a4a;
      --text: #e8e8ef;
      --text-dim: #8a8fa3;
      --shadow: rgba(0, 0, 0, 0.55);
    }

    :root.light {
      --bg: #f4f4f5;
      --border: #e4e4e7;
      --surface: #ffffff;
      --surface-hover: #f1f1f4;
      --text: #18181b;
      --text-dim: #71717a;
      --shadow: rgba(0, 0, 0, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background:
        radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 45%),
        var(--bg);
      color: var(--text);
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    main {
      width: min(440px, 100%);
      display: grid;
      justify-items: center;
      gap: 20px;
    }

    .clawd {
      width: 64px;
      height: 40px;
      fill: #d97757;
    }

    .card {
      width: 100%;
      display: grid;
      gap: 14px;
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 16px 48px var(--shadow);
    }

    h1 { font-size: 16px; font-weight: 600; }

    p { color: var(--text-dim); font-size: 13px; }

    code {
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--surface-hover);
      color: var(--text);
      font: inherit;
    }

    form { display: flex; gap: 8px; }

    input {
      flex: 1;
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }

    button {
      padding: 9px 16px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }

    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .error { color: #e5484d; }

    .error:empty { display: none; }
  </style>
  <script>
    (() => {
      let mode;
      let cached;
      try {
        mode = JSON.parse(localStorage.getItem('hub-theme'))?.theme;
        cached = JSON.parse(localStorage.getItem('hub-palette'));
      } catch {}
      mode ??= matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      const root = document.documentElement;
      root.classList.toggle('light', mode === 'light');
      if (cached?.key?.endsWith(`/${mode}`)) {
        for (const [name, value] of Object.entries(cached.vars ?? {})) root.style.setProperty(name, value);
      }
    })();
  </script>
</head>
<body>
  <main>
    <svg class="clawd" viewBox="1 0 16 10" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="3" y="0" width="12" height="2"/>
      <rect x="3" y="2" width="2" height="2"/>
      <rect x="6" y="2" width="6" height="2"/>
      <rect x="13" y="2" width="2" height="2"/>
      <rect x="1" y="4" width="16" height="2"/>
      <rect x="3" y="6" width="12" height="2"/>
      <rect x="4" y="8" width="1" height="2"/>
      <rect x="6" y="8" width="1" height="2"/>
      <rect x="11" y="8" width="1" height="2"/>
      <rect x="13" y="8" width="1" height="2"/>
    </svg>
    <div class="card">
      <h1>Unlock Claude Code Hub</h1>
      <p>Open the link the hub prints when it starts, or paste the token from <code>~/.claude-hub/token</code>. This browser remembers it.</p>
      <form id="unlock">
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Access token" aria-label="Access token" required autofocus>
        <button type="submit">Unlock</button>
      </form>
      <p class="error" id="error" role="alert"></p>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has('token')) {
      document.getElementById('error').textContent = 'That token does not match. Check it and try again.';
      params.delete('token');
      history.replaceState(null, '', location.pathname + (params.size ? `?${params}` : ''));
    }
    document.getElementById('unlock').addEventListener('submit', (e) => {
      e.preventDefault();
      params.set('token', document.getElementById('token').value.trim());
      location.replace(`${location.pathname}?${params}`);
    });
  </script>
</body>
</html>
