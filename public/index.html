<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="/manifest.json">
  <!-- A manifest alone does not set the favicon: without these, app windows,
       shortcuts and the history list fall back to /favicon.ico and then to whatever
       icon localhost was last seen with, which is a sub-app's. -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Claude Code Hub</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --border: #0f3460;
      /* Fallback until applyHubAccent() overrides it with the active theme's accent, and the value
         that stands if /api/config carries no accents. Ember, every sub-app's :root default. */
      --accent: #e86f33;
      --surface: #16213e;
      --surface-hover: #1f2a4a;
      --text: #e8e8ef;
      --text-dim: #8a8fa3;
      --shadow: rgba(0, 0, 0, 0.55);
    }

    /* applyHubTheme() owns light/dark and stamps this class, resolving the pushed hub:theme first
       and prefers-color-scheme only as its fallback. Deliberately not a @media block: the theme a
       sub-app pushed has to win over the OS preference, and the only surface painted before JS runs
       is a background the iframes immediately cover. */
    :root.light {
      --bg: #f4f4f5;
      --border: #e4e4e7;
      --surface: #ffffff;
      --surface-hover: #f1f1f4;
      --text: #18181b;
      --text-dim: #71717a;
      --shadow: rgba(0, 0, 0, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      height: 100vh;
      overflow: hidden;
    }

    .iframe-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg);
    }

    .iframe-container iframe.hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .loading-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Clawd, drawn from the Claude Code banner's block art; cck's boot splash uses the same one. */
    .clawd {
      width: 64px;
      height: 40px;
      fill: #d97757;
      overflow: visible;
      transform-origin: 50% 100%;
      animation: clawd-jump 0.9s ease-in-out infinite;
    }

    @keyframes clawd-jump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      15% { transform: translateY(0) scale(1.1, 0.85); }
      45% { transform: translateY(-14px) scale(0.95, 1.05); }
      70% { transform: translateY(0) scale(1.08, 0.9); }
      85% { transform: translateY(0) scale(1, 1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .clawd { animation: none; }
    }

    /* A faint outline of the app being loaded, so the wait reads as "the page is coming" rather
       than a blank screen. showLoading() keys it off the overlay's data-app. */
    .ghost {
      position: absolute;
      inset: 0;
      display: none;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
      pointer-events: none;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 0 80px, #000 240px);
      mask-image: radial-gradient(circle at 50% 50%, transparent 0 80px, #000 240px);
    }

    .ghost i {
      display: block;
      min-height: 12px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--text-dim) 10%, transparent);
    }

    .ghost .h { height: 18px; width: 45%; }
    .ghost .stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .ghost .row { display: flex; gap: 16px; }
    .ghost .row > i { flex: 1; }

    .loading-overlay[data-app="kanban"] .ghost-kanban,
    .loading-overlay[data-app="cost"] .ghost-cost,
    .loading-overlay[data-app="memory"] .ghost-memory,
    .loading-overlay[data-app="marketplace"] .ghost-marketplace { display: grid; }

    .ghost-kanban { grid-template-columns: 240px repeat(3, 1fr); }
    .ghost-kanban .side i { height: 30px; }
    .ghost-kanban .col i:not(.h) { height: 76px; }

    .ghost-cost { grid-template-rows: 84px 280px 150px; align-content: start; }
    .ghost-cost .bars { display: flex; align-items: flex-end; gap: 10px; }
    .ghost-cost .bars i { flex: 1; }
    .ghost-cost .stack i:not(.h) { height: 22px; }

    .ghost-memory { grid-template-columns: 280px 1fr; }
    .ghost-memory .side i { height: 22px; }
    .ghost-memory .side .in { margin-left: 18px; }
    .ghost-memory .side .in2 { margin-left: 36px; }
    .ghost-memory .doc i:not(.h) { height: 14px; }

    .ghost-marketplace { grid-template-rows: 40px 1fr; }
    .ghost-marketplace .cards { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 130px; gap: 16px; }

    .loading-overlay > :not(.ghost) { position: relative; }

    .loading-text {
      color: var(--text-dim);
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .loading-text:empty { display: none; }

    /* Switcher palette — the hub's only chrome. Ctrl+Alt+P for projects, Ctrl+Alt+W for Claude
       config dirs. */
    .palette {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 12vh;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
    }

    .palette[hidden] { display: none; }

    .palette-box {
      width: min(680px, 92vw);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 18px 48px var(--shadow);
      overflow: hidden;
      font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .palette-input {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .palette-input::placeholder { color: var(--text-dim); }

    .palette-list {
      list-style: none;
      max-height: 46vh;
      overflow-y: auto;
    }

    .palette-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 8px 14px;
      cursor: pointer;
      color: var(--text);
      white-space: nowrap;
    }

    /* Bar over the neutral hover background, no accent tint: the faintest theme accents
       (monokai light #c08a00, vitesse light #1c6b48) barely register as a tint, but read
       clearly as a 2px bar. */
    .palette-row.selected {
      background: var(--surface-hover);
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .palette-row .name { font-weight: 600; }

    /* The letters that made this row match. Accent-coloured rather than block-highlighted so it
       reads inside a bold name without fighting the selected row's bar. */
    .palette-row mark {
      background: transparent;
      color: var(--accent);
      font-weight: 700;
    }

    .palette-row .parent {
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .palette-row .age {
      color: var(--text-dim);
      margin-left: auto;
      padding-left: 10px;
    }

    .palette-row.literal {
      border-top: 1px solid var(--border);
      color: var(--accent);
    }

    .palette-empty {
      padding: 10px 14px;
      color: var(--text-dim);
    }

    /* Mirrors memory's picker: the remove control is hidden until the row is hovered or selected. */
    .palette-row .palette-remove {
      margin-left: auto;
      padding: 0 6px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font: inherit;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
    }

    .palette-row:hover .palette-remove,
    .palette-row.selected .palette-remove { opacity: 1; }

    .palette-row .palette-remove:hover { color: #e5484d; }

    .palette-hint {
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 12px;
    }

    .palette-hint:empty { display: none; }
  </style>
</head>
<body>
  <div class="iframe-container" id="iframe-container">
    <div class="loading-overlay" id="loading-overlay">
      <div class="ghost ghost-kanban" aria-hidden="true">
        <div class="stack side"><i class="h"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="stack col"><i class="h"></i><i></i><i></i><i></i></div>
        <div class="stack col"><i class="h"></i><i></i><i></i></div>
        <div class="stack col"><i class="h"></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="ghost ghost-cost" aria-hidden="true">
        <div class="row"><i></i><i></i><i></i><i></i></div>
        <div class="bars">
          <i style="height:35%"></i><i style="height:60%"></i><i style="height:45%"></i><i style="height:80%"></i>
          <i style="height:55%"></i><i style="height:30%"></i><i style="height:70%"></i><i style="height:50%"></i>
          <i style="height:65%"></i><i style="height:40%"></i><i style="height:75%"></i><i style="height:58%"></i>
        </div>
        <div class="stack"><i class="h"></i><i></i><i></i><i></i></div>
      </div>
      <div class="ghost ghost-memory" aria-hidden="true">
        <div class="stack side">
          <i class="h"></i><i></i><i class="in"></i><i class="in2"></i><i class="in2"></i><i class="in"></i>
          <i></i><i class="in"></i><i class="in2"></i><i class="in"></i><i></i>
        </div>
        <div class="stack doc">
          <i class="h"></i><i></i><i></i><i style="width:70%"></i><i></i><i style="width:85%"></i><i style="width:40%"></i>
        </div>
      </div>
      <div class="ghost ghost-marketplace" aria-hidden="true">
        <i></i>
        <div class="cards"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <svg class="clawd" viewBox="1 0 16 10" shape-rendering="crispEdges" aria-hidden="true">
        <rect x="3" y="0" width="12" height="2"/>
        <rect x="3" y="2" width="2" height="2"/>
        <rect x="6" y="2" width="6" height="2"/>
        <rect x="13" y="2" width="2" height="2"/>
        <rect x="1" y="4" width="16" height="2"/>
        <rect x="3" y="6" width="12" height="2"/>
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="6" y="8" width="1" height="2"/>
        <rect x="11" y="8" width="1" height="2"/>
        <rect x="13" y="8" width="1" height="2"/>
      </svg>
      <div class="loading-text" id="loading-text"></div>
    </div>
  </div>

  <div class="palette" id="palette" hidden>
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Switch project">
      <input class="palette-input" id="palette-input" type="text" spellcheck="false"
             autocomplete="off" placeholder="Search projects or type a path...">
      <ul class="palette-list" id="palette-list" role="listbox"></ul>
      <div class="palette-hint" id="palette-hint"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
